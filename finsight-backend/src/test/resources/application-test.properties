# Isolated test database; never import the developer's .env or contact PostgreSQL.
spring.datasource.url=jdbc:h2:mem:finsight-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,MONTH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
jwt.secret=${random.uuid}${random.uuid}
logging.level.org.springframework.boot.security.autoconfigure=ERROR
